<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TAICHI ISLAND ｜ 泰奇數位浮島・個人作品與心流聚落</title>
  <meta name="description" content="Taichi (YJ) 的個人 3D 互動作品集網站。整合 GitHub 開發專案（Swift、Rust、GIS、Python）、個人興趣（茶道、3D列印/雷雕/手繪、攝影、AI與資安）及社群連結。">
  <meta name="keywords" content="Taichi, Portfolio, 3D Island, Three.js, GitHub, Swift, Rust, Tea Ceremony, Maker, Photography, AI, Cybersecurity">
  
  <!-- Open Graph -->
  <meta property="og:title" content="TAICHI ISLAND ｜ 泰奇數位浮島・個人作品與心流聚落">
  <meta property="og:description" content="探索 3D 浮島世界：GitHub 開發軟體、生活藝術與社群矩陣。">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <!-- 3D WebGL Canvas Container -->
    <div id="stage" role="img" aria-label="3D 浮島群互動展示場景"></div>

    <!-- Loading Screen -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <h2>YJ ISLAND</h2>
      <p>正在構建 3D 數位浮島群與晨昏光影…</p>
    </div>

    <!-- Brand Header -->
    <header class="brand-header">
      <img src="https://avatars.githubusercontent.com/u/127074520?v=4" alt="Taichi Avatar" class="brand-avatar">
      <div class="brand-info">
        <h1>Taichi (YJ) <span class="brand-tag">PORTFOLIO</span></h1>
        <p>軟體開發者 · 藝術創客 · 數位漫遊者</p>
      </div>
    </header>

    <!-- Top Right Actions -->
    <div class="top-toolbar">
      <button id="sidebar-toggle" class="tool-btn" aria-label="展開內容清單">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        <span>內容清單</span>
      </button>
      <button id="help" class="tool-btn icon-only" aria-label="導覽操作說明" title="操作說明">?</button>
    </div>

    <!-- Bottom Mascot / Tip -->
    <div class="hint-badge">
      <div class="hint-dot"></div>
      <span>拖曳滑鼠 360° 旋轉視角 · 點擊島嶼探索內容</span>
    </div>

    <!-- Day / Night Time HUD -->
    <section class="time-hud" aria-label="時段與晝夜切換">
      <div class="time-presets" role="group">
        <button class="time-btn" data-time="360" title="清晨 06:00">🌅 清晨</button>
        <button class="time-btn active" data-time="720" title="白天 12:00">☀️ 白天</button>
        <button class="time-btn" data-time="1080" title="黃昏 18:00">🌇 黃昏</button>
        <button class="time-btn" data-time="1260" title="夜晚 21:00">🌌 夜晚</button>
      </div>
      <div class="time-slider-wrap">
        <button id="day-play" class="play-btn" title="循環播放晝夜">▶</button>
        <input id="day" type="range" min="0" max="1439" value="720" aria-label="晝夜時間微調">
        <span id="clock" class="clock-text">12:00</span>
      </div>
    </section>

    <!-- Bottom Navigation Dock -->
    <nav class="dock" aria-label="快速導覽群島">
      <button class="dock-btn active" data-dock="overview">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        全景
      </button>
      <button class="dock-btn" data-dock="dev">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        開發島
      </button>
      <button class="dock-btn" data-dock="zen">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
        藝境島
      </button>
      <button class="dock-btn" data-dock="beacon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        燈塔島
      </button>
      <button class="dock-btn" data-dock="bird">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        鳥瞰
      </button>
    </nav>

    <!-- Sidebar Drawer (Inspired by Policy Island Index) -->
    <aside id="sidebar" class="sidebar" aria-label="全站導覽與作品索引">
      <div class="side-header">
        <div class="side-top-row">
          <span class="side-eyebrow">PORTFOLIO INDEX</span>
          <button id="sidebar-close" class="close-btn" aria-label="關閉清單">✕</button>
        </div>
        <h2>數位聚落索引</h2>
        <p>跨界程式實踐、創客藝術工坊與社交信標連結。</p>
        <input id="search" class="search-input" type="search" placeholder="搜尋專案、語言、興趣關鍵字…">
        <div class="side-tabs">
          <button class="active" data-filter="all">全部</button>
          <button data-filter="projects">GitHub 專案</button>
          <button data-filter="interests">個人興趣</button>
          <button data-filter="social">社群連結</button>
        </div>
      </div>
      <div id="tree" class="side-body"></div>
    </aside>

    <!-- Floating Item Detail Card (Triggered by 3D click or sidebar) -->
    <article id="card" class="floating-card" aria-label="項目詳細資料">
      <button id="card-close" class="close-btn" style="position:absolute; top:1rem; right:1rem;" aria-label="關閉卡片">✕</button>
      <div id="card-content"></div>
    </article>

    <!-- Help Modal -->
    <div id="help-modal" class="modal-overlay">
      <div class="modal-content">
        <h3>島嶼探索指南</h3>
        <p>歡迎來到 Taichi 的 3D 數位浮島世界，您可以透過以下方式自由漫遊：</p>
        <div class="help-grid">
          <div class="help-item">
            <span class="help-badge">左鍵拖曳</span>
            <span>360° 旋轉視角環視島嶼</span>
          </div>
          <div class="help-item">
            <span class="help-badge">滾輪縮放</span>
            <span>放大細看建築或拉遠縱覽全局</span>
          </div>
          <div class="help-item">
            <span class="help-badge">點擊建築</span>
            <span>鏡頭自動平滑推近並展開詳細資訊卡</span>
          </div>
          <div class="help-item">
            <span class="help-badge">時段按鈕</span>
            <span>切換清晨、白天、黃昏與夜景光影</span>
          </div>
        </div>
        <button id="help-close" class="btn-primary">開始探索！</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
